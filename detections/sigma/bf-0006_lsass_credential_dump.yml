title: LSASS Memory Dump Attempt
id: bf-0006
status: experimental
description: >
  LSASS holds credentials in memory. Dumping it (procdump -ma lsass, rundll32
  comsvcs.dll MiniDump, taskmgr right-click dump) gives an attacker password
  hashes and Kerberos tickets for lateral movement. Any process command line
  referencing lsass alongside a dump primitive is high-confidence hostile.
author: Ravi
date: 2026/07/13
level: critical
mitre:
  - T1003.001
logsource:
  category: process
detection:
  command_line|contains:
    - "lsass"
  condition: all
falsepositives:
  - Antivirus and EDR agents legitimately open LSASS handles, but they rarely
    pass "lsass" on a command line. Crash-dump tooling used by helpdesk is the
    main benign source. Tune on the parent process.
